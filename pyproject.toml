[project]
name = "cursor-dashboard"
version = "1.1.0"
description = "查询多个 Cursor 账号的订阅套餐和额度余量（Web 面板 + 命令行）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.31",
]

[project.scripts]
cursor-panel = "cursor_dashboard.server:main"
cursor-quota = "cursor_dashboard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cursor_dashboard"]
