<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Cursor 额度面板</title>
<style>
  :root {
    --bg: #0e1013; --card: #171a1f; --card-hi: #1d2128; --line: #272c34;
    --fg: #e6e9ef; --dim: #8b93a1; --dimmer: #5e6674;
    --accent: #5b9cff; --ok: #3fbf7f; --warn: #e8b339; --bad: #ef5f5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 24px 64px; }
  header { display: flex; align-items: baseline; gap: 14px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: .2px; }
  .sub { color: var(--dimmer); font-size: 12px; }
  .bar-top { display: flex; gap: 10px; margin: 20px 0 12px; align-items: center; }
  .spacer { flex: 1; }
  .stamp { color: var(--dimmer); font-size: 12px; }
  .sort-control { display: flex; align-items: center; gap: 7px; flex: none; }
  .sort-control label { margin: 0; color: var(--dimmer); white-space: nowrap; }
  #sort-order {
    width: 184px; padding: 7px 30px 7px 10px; background: var(--card-hi);
  }

  .department-nav {
    display: flex; align-items: flex-end; gap: 14px; margin: 0 0 24px;
    border-bottom: 1px solid var(--line); min-width: 0;
  }
  .department-caption { color: var(--dimmer); font-size: 11px; padding: 9px 0; flex: none; }
  .department-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .department-tabs::-webkit-scrollbar { display: none; }
  button.department-tab {
    position: relative; flex: none; border: 0; border-radius: 0; background: transparent;
    color: var(--dim); padding: 8px 10px 9px; white-space: nowrap;
  }
  button.department-tab:hover:not(:disabled) { background: transparent; border-color: transparent; color: var(--fg); }
  button.department-tab[aria-selected="true"] { color: var(--fg); }
  button.department-tab[aria-selected="true"]::after {
    content: ""; position: absolute; height: 2px; left: 10px; right: 10px; bottom: -1px;
    background: var(--accent);
  }
  .department-count { color: var(--dimmer); font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; }

  button {
    font: inherit; color: var(--fg); background: var(--card-hi);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 14px;
    cursor: pointer; transition: background .12s, border-color .12s, color .12s;
  }
  button:hover:not(:disabled) { background: #242932; border-color: #39414d; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08131f; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #74acff; border-color: #74acff; }

  /* ---------- 悬停提示 ---------- */
  .tip { position: relative; }
  .tip::after {
    content: attr(data-tip);
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: calc(100% + 8px);
    background: #0b0d10; color: var(--fg); border: 1px solid var(--line);
    padding: 7px 10px; border-radius: 8px;
    font-size: 11.5px; font-weight: 400; line-height: 1.6; text-align: left;
    width: max-content; max-width: 230px;
    opacity: 0; visibility: hidden;
    transition: opacity .14s, visibility 0s .14s;
    pointer-events: none; z-index: 20;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
  }
  .tip:hover::after {
    opacity: 1; visibility: visible;
    transition: opacity .14s .25s, visibility 0s .25s;
  }
  /* 卡片右上角的按钮把提示放到下方，免得顶出卡片外 */
  .tip.below::after { bottom: auto; top: calc(100% + 8px); }
  .tip.right::after { left: auto; right: 0; transform: none; }
  .tip.left::after { left: 0; transform: none; }

  /* ---------- 卡片 ---------- */
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 14px; position: relative; min-height: 320px; }
  .card.dead { border-color: #4a2b2b; }
  .card.exhausted { background: #1d171a; border-color: #4a2d34; }
  .burnout-watermark {
    position: absolute; inset: 0;
    color: rgba(239, 82, 88, .34);
    font-family: "Kaiti SC", STKaiti, KaiTi, "PingFang SC", sans-serif;
    font-style: italic; font-weight: 700; line-height: 1;
    pointer-events: none; user-select: none;
  }
  .burnout-watermark span {
    position: absolute; display: block; width: 1em; text-align: center;
    transform-origin: center;
  }
  .burnout-watermark span:nth-child(1) {
    left: 5%; top: 58%; font-size: 88px; transform: rotate(-18deg) skewX(-10deg);
  }
  .burnout-watermark span:nth-child(2) {
    left: 35%; top: 35%; font-size: 96px; transform: rotate(-11deg) skewX(-9deg);
  }
  .burnout-watermark span:nth-child(3) {
    left: 67%; top: 13%; font-size: 82px; transform: rotate(-5deg) skewX(-8deg);
  }
  .card.exhausted .quota,
  .card.exhausted .meta,
  .card.exhausted .stale { position: relative; z-index: 1; }

  /* 名字始终盖在丝带和燃尽水印上面——丝带是背景装饰，不该顶开卡片布局 */
  .card-head { min-height: 40px; position: relative; z-index: 1; }
  .name-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-right: 124px; }
  .label { font-size: 15px; font-weight: 600; }
  .identity-meta { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 4px 8px; margin-top: 2px; min-width: 0; }
  .email {
    color: var(--dim); font-size: 12px; min-width: 0; flex: 1 1 150px;
    overflow-wrap: anywhere;
  }
  .department-mark {
    color: var(--dim); font-size: 10.5px; line-height: 1.45; border-left: 2px solid var(--accent);
    padding-left: 6px; white-space: nowrap;
  }
  .plan {
    font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 20px; padding: 2px 9px; white-space: nowrap; line-height: 1.5;
  }

  /* 左上角角标：整屏扫视时靠它分批，四档跟 color() 的阈值同源。
     实心直角三角，不是斜带——带子两侧留出来的那点背景纯属多余，反而显脏。
     裁剪交给 .ribbon 自己的 overflow: hidden，**不要图省事给 .card 加
     overflow: hidden**，那会把额度行往上弹的 tooltip 一起裁掉 */
  .ribbon {
    position: absolute; top: 0; left: 0; width: 56px; height: 56px;
    overflow: hidden; border-radius: 12px 0 0 0; pointer-events: none; z-index: 0;
  }
  /* 斜边落在 x+y = 38。名字第一个字的字形左上角在 x+y ≈ 42，三角形必须停在它前面：
     卡片不加高的前提下，名字是不会给角标让位的，越过去就会糊在一起。
     直角尖顶在 (0,0)，靠容器的 border-radius 修成和卡片一致的圆角 */
  .ribbon::before {
    content: ""; position: absolute; top: 0; left: 0; width: 38px; height: 38px;
    background: var(--ok); clip-path: polygon(0 0, 100% 0, 0 100%);
  }
  /* 文字沿对角线摆正：cx = left + width/2 = 12，cy = top + height/2 = 12，
     **两者必须相等**，否则文字偏向三角形的一头而不是正中。
     x+y = 24 这条线上三角形还有 34px 宽，两个 10px 汉字占 20px，两端各留 7px；
     位置略偏向斜边一侧——靠角那头窄，字挤过去只会贴边。
     字距留 0——两个汉字加了字距，末字右边多出的一份空隙会让整块字看着往左偏 */
  .ribbon b {
    position: absolute; left: -28px; top: 7px; width: 80px;
    transform: rotate(-45deg); text-align: center;
    font-size: 10px; font-weight: 700; line-height: 1;
    color: #0b0f14;
  }
  .ribbon.warn::before { background: var(--warn); }
  .ribbon.bad::before { background: var(--bad); }
  .ribbon.dry::before { background: #6b3a44; }
  .ribbon.dry b { color: #f4d9dd; }

  /* 右上角的周期环：环走过多少 = 本周期过了多少，中心是还剩多久刷新。
     这块地方平时是空的（操作按钮只在 hover 时出现），鼠标一进卡片环就淡出让位。
     环刻意 pointer-events: none —— 它压着删除/刷新按钮，能接鼠标就会挡住点击 */
  .cycle-ring {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 44px; height: 44px; display: grid; place-items: center;
    pointer-events: none; transition: opacity .12s;
  }
  .card:hover .cycle-ring, .card:focus-within .cycle-ring { opacity: 0; }
  .cycle-ring svg { position: absolute; inset: 0; width: 44px; height: 44px; transform: rotate(-90deg); }
  .cycle-ring circle { fill: none; stroke-width: 3.5; }
  .ring-track { stroke: #2b313b; }
  .ring-fill { stroke: var(--dim); stroke-linecap: round; transition: stroke-dashoffset .4s ease; }
  /* 快到刷新点了：额度即将回血，是好消息，所以用蓝色而不是告警色 */
  .cycle-ring.soon .ring-fill { stroke: var(--accent); }
  .ring-text { font-size: 9.5px; color: var(--dim); line-height: 1; font-variant-numeric: tabular-nums; }
  .ring-text b { font-size: 13px; color: var(--fg); font-weight: 600; margin-right: 1px; }

  .acts { position: absolute; top: 13px; right: 12px; z-index: 2; display: flex; gap: 2px; opacity: 0; transition: opacity .12s; }
  .card:hover .acts, .card:focus-within .acts { opacity: 1; }
  .icon-btn {
    width: 28px; height: 28px; padding: 0;
    display: grid; place-items: center;
    background: transparent; border: 1px solid transparent; border-radius: 7px;
    color: var(--dim);
  }
  .icon-btn:hover:not(:disabled) { background: var(--card-hi); border-color: var(--line); color: var(--fg); }
  .icon-btn.danger:hover:not(:disabled) { color: var(--bad); border-color: #4a2b2b; }
  .icon-btn svg { width: 15px; height: 15px; display: block; }

  /* 三条额度都是按钮：点开看本周期用了哪些模型。整行可点，命中面积比图标大得多 */
  .quota { margin: 10px 0 9px; display: flex; flex-direction: column; gap: 2px; }
  /* 行高压到 1.35：body 的 1.55 是给正文段落的，这里每行只有一句话，
     照搬过来三行就白高出 7px。padding 收到 4/5 仍有 33px 的命中高度 */
  button.q-row {
    display: grid; grid-template-columns: 1fr auto auto; gap: 3px 8px; align-items: baseline;
    width: calc(100% + 16px); margin: 0 -8px; padding: 4px 8px 5px; line-height: 1.35;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    text-align: left;
  }
  button.q-row:hover:not(:disabled), button.q-row:focus-visible {
    background: var(--card-hi); border-color: var(--line); outline: none;
  }
  button.q-row:hover .q-name, button.q-row:focus-visible .q-name { color: var(--fg); }
  .q-name { color: var(--dim); font-size: 12px; transition: color .12s; }
  .q-limit { color: var(--dimmer); font-size: 11px; margin-left: 5px; font-variant-numeric: tabular-nums; }
  .q-val { font-variant-numeric: tabular-nums; font-size: 12px; font-weight: 600; }
  /* 常驻的箭头才是"能点"的信号——只在 hover 时才有反馈的话，没人会想到去点 */
  .q-go { color: var(--dimmer); align-self: center; display: flex; transition: transform .12s, color .12s; }
  .q-go svg { width: 14px; height: 14px; display: block; }
  button.q-row:hover .q-go, button.q-row:focus-visible .q-go {
    color: var(--fg); transform: translateX(2px);
  }
  .track { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: #23272f; overflow: hidden; }
  .fill { height: 100%; border-radius: 3px; transition: width .35s ease; }

  .meta { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .meta > div { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--dim); }
  .meta > div > span:first-child { flex: none; }
  .meta b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; min-width: 0; text-align: right; }
  .meta .tip { border-bottom: 1px dotted var(--dimmer); cursor: help; }
  .stale { margin-top: 8px; font-size: 11.5px; color: var(--warn); line-height: 1.6; }
  .skel-note { color: var(--dimmer); font-size: 11.5px; margin-top: 14px; }
  .err { color: var(--bad); font-size: 13px; margin: 14px 0 12px; }

  /* ---------- 加载骨架 ---------- */
  @keyframes shimmer { from { background-position: 180% 0; } to { background-position: -180% 0; } }
  .skel {
    background: linear-gradient(90deg, #1b1f26 20%, #262c37 40%, #1b1f26 60%);
    background-size: 220% 100%; animation: shimmer 1.5s linear infinite;
    border-radius: 5px; height: 10px;
  }
  .skel-line { margin-bottom: 9px; }

  .empty { border: 1px dashed var(--line); border-radius: 12px; padding: 48px 24px; text-align: center; color: var(--dim); }
  .empty p { margin: 0 0 18px; }

  /* 必须 fixed：只写 position: relative 会覆盖 UA 给 dialog:modal 的 fixed，
     弹窗就跟着回到文档流末尾，showModal() 把焦点移进来时整页会跟着滚一下 */
  dialog {
    background: var(--card); color: var(--fg); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; width: min(460px, calc(100vw - 40px));
    position: fixed; inset: 0; margin: auto;
    max-height: calc(100dvh - 48px); overflow-y: auto; overscroll-behavior: contain;
  }
  /* 弹窗开着时锁住背景滚动，补上滚动条宽度免得整页横向跳一下 */
  body.modal-open { overflow: hidden; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  /* 明细弹窗内容最长：头尾钉住、只让表格滚，关闭按钮才不会被推走或挡住花费列 */
  /* display 只能写在 [open] 上：写在 dialog.wide 上会盖掉 UA 的
     dialog:not([open]) { display: none }，关掉之后弹窗还赖在页面上 */
  dialog.wide { width: min(820px, calc(100vw - 32px)); overflow: hidden; }
  dialog.wide[open] { display: flex; flex-direction: column; }
  dialog.wide #detail-body {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  }

  dialog h2 { margin: 0 0 18px; padding-right: 30px; font-size: 16px; }
  .dialog-close {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 30px; height: 30px; padding: 0;
    display: grid; place-items: center; background: transparent; border-color: transparent;
    color: var(--dim);
  }
  .dialog-close:hover:not(:disabled) { color: var(--fg); }
  .dialog-close svg { width: 16px; height: 16px; }
  dialog p { color: var(--dim); font-size: 13px; margin: 0 0 16px; line-height: 1.7; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 0 0 6px; }
  .optional { color: var(--dimmer); margin-left: 4px; }
  .f { margin-bottom: 14px; }
  input[type=text], input[type=password], select, textarea {
    width: 100%; font: inherit; color: var(--fg); background: #0f1216;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 11px;
  }
  select { color-scheme: dark; cursor: pointer; }
  .new-department { margin-top: 8px; }
  .new-department[hidden] { display: none; }
  textarea { min-height: 92px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .hint-text { color: var(--dimmer); font-size: 11.5px; line-height: 1.75; margin: 7px 0 0; }
  .hint-text code { background: #0f1216; border-radius: 4px; padding: 1px 5px; }
  /* ---------- 模型明细 ---------- */
  .detail-note { color: var(--dimmer); font-size: 11.5px; line-height: 1.7; margin: -8px 0 18px; }
  .detail-group { margin-bottom: 22px; }
  .detail-group:last-child { margin-bottom: 0; }
  .detail-group-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-bottom: 8px;
  }
  .detail-group-name { font-size: 13px; font-weight: 600; }
  .detail-group-sum { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .detail-scroll { overflow-x: auto; }
  table.detail { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.detail th {
    color: var(--dimmer); font-size: 11px; font-weight: 500; text-align: right;
    padding: 0 0 7px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  table.detail td {
    padding: 7px 0; text-align: right; white-space: nowrap;
    border-bottom: 1px solid #1e222a; font-variant-numeric: tabular-nums;
  }
  table.detail th:first-child, table.detail td:first-child { text-align: left; }
  table.detail th + th, table.detail td + td { padding-left: 16px; }
  table.detail tbody tr:last-child td { border-bottom: 0; }
  table.detail .model {
    color: var(--fg); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; white-space: normal; overflow-wrap: anywhere;
  }
  table.detail .cost { font-weight: 600; }
  table.detail .zero { color: var(--dimmer); }
  .detail-empty { color: var(--dim); font-size: 12.5px; padding: 6px 0 2px; }
  /* 花费是 Cursor 算好的，接口不给单价，想核对只能去官方价目表 */
  .detail-pricing {
    border-top: 1px solid var(--line); margin-top: 18px; padding-top: 12px;
    color: var(--dimmer); font-size: 11.5px; line-height: 1.75;
  }
  /* 加载骨架照着真实表格的列宽排，读出来的位置和填上数据后是同一处，不会跳 */
  .detail-skel-head {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; margin-bottom: 12px;
  }
  .detail-skel-row {
    display: grid; grid-template-columns: 1fr 54px 54px 54px 54px 54px;
    gap: 16px; align-items: center; padding: 9px 0; border-bottom: 1px solid #1e222a;
  }
  .detail-skel-row:last-child { border-bottom: 0; }
  /* 表头那条线也占上，填上数据时整块不会往下错一行 */
  .detail-skel-row.head { padding: 0 0 8px; border-bottom-color: var(--line); }
  .detail-skel-row.head .skel { height: 7px; opacity: .7; }
  .detail-total {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border-top: 1px solid var(--line); margin-top: 18px; padding-top: 12px;
    color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums;
  }

  .row { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 20px; }
  .status { font-size: 13px; min-height: 20px; white-space: pre-wrap; }
  .status.bad { color: var(--bad); }
  .status.good { color: var(--ok); }
  .status.busy { color: var(--dim); }
  a { color: var(--accent); }

  @media (max-width: 620px) {
    .wrap { padding: 22px 14px 48px; }
    .bar-top { flex-wrap: wrap; }
    .bar-top .spacer { display: none; }
    .sort-control { margin-left: auto; }
    #sort-order { width: 168px; }
    .bar-top .stamp { width: 100%; order: 5; }
    .department-nav { gap: 6px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .card { padding-left: 15px; padding-right: 15px; }
    .card-head { padding-top: 30px; }
    .name-line { padding-right: 0; }
    .acts { opacity: 1; }
    /* 按钮常驻，环挪到按钮左边并排放，别再淡出 */
    .cycle-ring { top: 5px; right: 130px; }
    .card:hover .cycle-ring, .card:focus-within .cycle-ring { opacity: 1; }
    .row { flex-wrap: wrap; }
    .row .status { width: 100%; }
  }
  @media (max-width: 620px) {
    table.detail th + th, table.detail td + td { padding-left: 10px; }
    .detail-group-head { margin-bottom: 6px; }
  }
  @media (max-width: 360px) {
    .meta > div { gap: 6px; font-size: 11px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Cursor 额度面板</h1>
    <span class="sub">cookie 只存服务端</span>
  </header>

  <div class="bar-top">
    <button class="primary" id="add">+ 添加账号</button>
    <span class="spacer"></span>
    <div class="sort-control">
      <label for="sort-order">排序</label>
      <select id="sort-order">
        <option value="added">添加顺序</option>
        <option value="remaining-asc">综合剩余：低到高</option>
        <option value="remaining-desc">综合剩余：高到低</option>
      </select>
    </div>

<script>
const $ = (s) => document.querySelector(s);
const view = $('#view');

let token = localStorage.getItem('panelToken') || '';
const headers = () => token ? { 'X-Panel-Token': token } : {};
const jsonHeaders = () => ({ 'Content-Type': 'application/json', ...headers() });

const ALL_DEPARTMENTS = '__all_departments__';
const NEW_DEPARTMENT = '__new_department__';
const SORT_ADDED = 'added';
const SORT_REMAINING_ASC = 'remaining-asc';
const SORT_REMAINING_DESC = 'remaining-desc';
const SORT_MODES = new Set([SORT_ADDED, SORT_REMAINING_ASC, SORT_REMAINING_DESC]);
const storedDepartment = localStorage.getItem('selectedDepartment');
let selectedDepartment = storedDepartment === null ? ALL_DEPARTMENTS : storedDepartment;
const storedSortMode = localStorage.getItem('accountSort');
let sortMode = SORT_MODES.has(storedSortMode) ? storedSortMode : SORT_ADDED;
let accounts = [];   // 当前部门的卡片，按索引顺序逐张替换加载结果
let departmentSummary = [];
let totalAccountCount = 0;
let loadGeneration = 0;
let loadController = null;
let inFlight = false;
let autoRefreshCycle = 0;          // 后台轮一遍所有账号要多久，由 /api/config 给
const POLL_INTERVAL = 60000;       // 只读服务端快照，不打 cursor.com

const money = (n) => '$' + Number(n || 0).toFixed(2);
// 额度上限基本都是整美元（实测 $450 / $45 / $495），整数就别拖两位小数了
const shortMoney = (n) => {
  const v = Number(n || 0);
  return '$' + (Math.abs(v - Math.round(v)) < 0.005 ? Math.round(v) : v.toFixed(2));
};
// token 数动辄上亿，表格里按 Cursor 自己的写法缩成 M / K，精确值挂 title
const shortTokens = (n) => {
  const v = Number(n || 0);
  if (!v) return '—';
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'K';
  return String(v);
};
const exactTokens = (n) => Number(n || 0).toLocaleString('en-US') + ' tokens';
const pad2 = (n) => String(n).padStart(2, '0');
const parseDate = (iso) => {
  const value = iso ? new Date(iso) : null;
  return value && !Number.isNaN(value.getTime()) ? value : null;
};
const localDate = (iso) => {
  const value = parseDate(iso);
  return value
    ? `${value.getFullYear()}-${pad2(value.getMonth() + 1)}-${pad2(value.getDate())}`
    : '—';
};
const localDateTime = (iso) => {
  const value = parseDate(iso);
  return value
    ? `${localDate(iso)} ${pad2(value.getHours())}:${pad2(value.getMinutes())}`
    : '—';
};

function relative(ms, now = Date.now()) {
  const diff = now - ms;
  if (diff < 60000) return '刚刚';
  const minutes = Math.floor(diff / 60000);
  if (minutes < 60) return `${minutes} 分钟前`;
  const hours = Math.floor(minutes / 60);
  if (hours < 24) return `${hours} 小时前`;
  return `${Math.floor(hours / 24)} 天前`;
}

// 后台是错开刷的，每张卡的统计时刻都不一样，所以时间要落在卡片上而不是页头
function statTime(iso) {
  const value = parseDate(iso);
  if (!value) return '—';
  const clock = `${pad2(value.getHours())}:${pad2(value.getMinutes())}`;
  const sameDay = new Date().toDateString() === value.toDateString();
  const stamp = sameDay ? clock
    : `${pad2(value.getMonth() + 1)}-${pad2(value.getDate())} ${clock}`;
  return `${stamp} · ${relative(value.getTime())}`;
}

const color = (r) => r <= 10 ? 'var(--bad)' : r <= 30 ? 'var(--warn)' : 'var(--ok)';

// 左上角丝带的四档，阈值跟 color() 同源——两处颜色对不上的话，卡片自己就自相矛盾了
function quotaTier(quota) {
  const r = quota?.overall?.remaining_pct ?? null;
  if (r == null) return null;
  if (r <= 0) return { cls: 'dry', text: '燃尽' };
  if (r <= 10) return { cls: 'bad', text: '告急' };
  if (r <= 30) return { cls: 'warn', text: '偏紧' };
  return { cls: 'ok', text: '充足' };
}

function ribbon(tier) {
  // 纯视觉冗余：同一件事下面三条额度条已经用百分比说过了，读屏不必再念一遍
  return tier ? `<span class="ribbon ${tier.cls}" aria-hidden="true"><b>${tier.text}</b></span>` : '';
}

const RING_R = 19;
const RING_C = 2 * Math.PI * RING_R;

// meta 行里的剩余时间。跟环中心的字同一口径，只是这里写得开，能说完整的"剩1天20小时"
function remainingUntil(iso, now = Date.now()) {
  const reset = parseDate(iso);
  if (!reset) return '';
  const remainingMs = reset.getTime() - now;
  if (remainingMs <= 0) return '已到刷新时间';
  const hours = Math.floor(remainingMs / 3600000);
  if (hours < 1) return '剩不足1小时';
  if (hours < 24) return `剩${hours}小时`;
  if (hours < 48) return `剩1天${hours - 24}小时`;
  return `剩${Math.floor(hours / 24)}天`;
}

// 环中心的字：剩余时间一律从 reset_at 现算（浏览器本地时区），不用后端向下取整的
// days_left；不足 48 小时就报到小时，免得"剩 1 天"把 47 小时和 25 小时说成一回事
function remainingParts(resetMs, now = Date.now()) {
  const left = resetMs - now;
  if (left <= 0) return { num: '已到', unit: '' };
  const hours = Math.floor(left / 3600000);
  if (hours < 1) return { num: '<1', unit: '时' };
  if (hours < 48) return { num: String(hours), unit: '时' };
  return { num: String(Math.floor(hours / 24)), unit: '天' };
}

// 周期环：环走过的比例 = 本周期已经过去的比例。
// cycle.start 缺失（升级前存的旧快照就没有）时只报剩余时间、不画弧——
// 拿 30 天猜一个周期长度画出来的弧是假的，宁可空着
function cycleRing(cycle, now = Date.now()) {
  const end = parseDate(cycle.reset_at);
  if (!end) return '';
  const start = parseDate(cycle.start);
  const span = start ? end.getTime() - start.getTime() : 0;
  const left = end.getTime() - now;
  const passed = span > 0 ? Math.min(1, Math.max(0, (span - left) / span)) : 0;
  const { num, unit } = remainingParts(end.getTime(), now);
  const soon = left > 0 && left <= 86400000;
  // 环和丝带都 aria-hidden：剩余时间 meta 行念得更全（"剩1天20小时"），
  // 额度档位额度条也念过百分比，读屏没必要再听一遍
  return `<span class="cycle-ring${soon ? ' soon' : ''}" aria-hidden="true">
    <svg viewBox="0 0 44 44">
      <circle class="ring-track" cx="22" cy="22" r="${RING_R}"/>
      <circle class="ring-fill" cx="22" cy="22" r="${RING_R}"
        stroke-dasharray="${RING_C.toFixed(1)}"
        stroke-dashoffset="${(RING_C * (1 - passed)).toFixed(1)}"/>
    </svg>
    <span class="ring-text"><b>${num}</b>${unit}</span>
  </span>`;
}

const quotaExhausted = (quota) =>
  quota?.overall?.remaining_pct != null && Number(quota.overall.remaining_pct) <= 0;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const SVG = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const ICON = {
  department: SVG('<path d="M6 22V4c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v18"/><path d="M6 12H4c-.6 0-1 .4-1 1v9h18V8c0-.6-.4-1-1-1h-2"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/>'),
  key: SVG('<circle cx="7.5" cy="16.5" r="5"/><path d="m11.5 13 8.5-8.5"/><path d="m17 7 2.5 2.5"/><path d="M20 4l2 2"/>'),
  refresh: SVG('<path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/>'),
  chevron: SVG('<path d="m9 18 6-6-6-6"/>'),
  trash: SVG('<path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M18 6v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6"/>'),
};

const GROK_TIP = 'Grok Bot 是 x.ai 的独立 App（用 Cursor 账号登录），额度单独结算：'
  + '不占用上面的 Cursor Models / Other Models，按周重置。'
  + '没装这个 App 的话，这行会一直是 100%。';

// 额度上限是服务端从官方百分比反解出来的（见 usage.pool_limits），解不出就不显示，
// 绝不拿 included_usd（$20）顶替——那是订阅价，不是这条额度的池子
function bar(name, q, id, group) {
  const r = q.remaining_pct;
  const limit = q.limit_usd == null ? ''
    : `<span class="q-limit">${esc(shortMoney(q.limit_usd))}</span>`;
  return `<button type="button" class="q-row tip left" data-detail="${esc(id)}"
      data-group="${esc(group)}" data-tip="查看详情 · 本周期用了哪些模型">
    <span class="q-name">${name}${limit}</span>
    <span class="q-val" style="color:${color(r)}">剩 ${r.toFixed(1)}%</span>
    <span class="q-go" aria-hidden="true">${ICON.chevron}</span>
    <div class="track"><div class="fill" style="width:${Math.min(100, q.used_pct)}%;background:${color(r)}"></div></div>
  </button>`;
}

const overspent = (overall, spend) =>
  overall.limit_usd != null && spend.total > overall.limit_usd + 0.005;

// 超出上限的部分标红。Cursor 允许小幅超一点（实测用满的账号停在 $495.3 上下），
// 这时"剩 0.0%"和"$495.32 / $495"说的是同一件事，红字把超出说清楚
function spendValue(overall, spend) {
  const amount = overspent(overall, spend)
    ? `<span style="color:var(--bad)">${money(spend.total)}</span>`
    : money(spend.total);
  return overall.limit_usd == null ? amount
    : `${amount} / ${esc(shortMoney(overall.limit_usd))}`;
}

// 分母用综合额度池，跟上面那条「综合 剩 x%」同口径。订阅价 $20 是另一回事——
// 它只是"包含额度"，超出部分走 Cursor 赠送额度，摆在分母上会让人以为超支了 10 倍
function spendTip(overall, plan, spend) {
  const included = `订阅本身含额度 ${money(plan.included_usd)}`;
  if (overall.limit_usd == null) return included;
  const over = overspent(overall, spend)
    ? `已超出上限 ${money(spend.total - overall.limit_usd)}。` : '';
  return `${over}${included}，超出的走 Cursor 赠送额度。分母 ${shortMoney(overall.limit_usd)} 是本周期两类模型额度的合计上限。`;
}

function actions(a) {
  return `<div class="acts">
    <button class="icon-btn tip below" data-dept-id="${esc(a.id)}" data-label="${esc(a.label)}"
      data-department="${esc(a.department)}" aria-label="调整分组"
      data-tip="调整所属部门">${ICON.department}</button>
    <button class="icon-btn tip below" data-edit="${esc(a.id)}" data-label="${esc(a.label)}"
      data-department="${esc(a.department)}" aria-label="重新授权"
      data-tip="重新授权 · 粘贴新的 cookie">${ICON.key}</button>
    <button class="icon-btn tip below" data-one="${esc(a.id)}" aria-label="刷新账号"
      data-tip="刷新这个账号的额度">${ICON.refresh}</button>
    <button class="icon-btn tip below right danger" data-del="${esc(a.id)}" aria-label="删除账号"
      data-tip="删除账号">${ICON.trash}</button>
  </div>`;
}

function skeleton(account = null, note = '') {
  const head = account && account.id
    ? `<div class="card-head">
        <div class="name-line"><span class="label">${esc(account.label)}</span></div>
        <div class="identity-meta">
          <span class="department-mark">${esc(departmentName(account.department))}</span>
          <span class="email">${esc(account.email)}</span>
        </div>
      </div>`
    : `<div class="skel skel-line" style="width:38%;height:14px"></div>
       <div class="skel skel-line" style="width:58%;margin-bottom:22px"></div>`;
  return `<div class="card">
    ${head}
    <div class="skel skel-line" style="width:100%"></div>
    <div class="skel skel-line" style="width:100%"></div>
    <div class="skel skel-line" style="width:100%;margin-bottom:22px"></div>
    <div class="skel skel-line" style="width:72%"></div>
    <div class="skel skel-line" style="width:64%"></div>
    <div class="skel" style="width:80%"></div>
    ${note ? `<div class="skel-note">${esc(note)}</div>` : ''}
  </div>`;
}

// 刷新失败但还留着上一份数据时的说明。这里刻意不说"会话失效"——被限流时
// 说失效会把人骗去重新粘贴 cookie，而那次粘贴同样会被挡住。
const STALE_TEXT = {
  rate_limited: 'Cursor 暂时限制了请求，后台会自动重试',
  expired: '刷新时被判为会话失效，正在确认',
  network: '刷新时连不上 Cursor，后台会自动重试',
};
const staleText = (a) =>
  `${STALE_TEXT[a.error_kind] || a.error || '刷新失败'}；上面仍是上一次统计的数据`;

function card(a) {
  if (a._loading) return skeleton(a);
  if (a.pending) return skeleton(a, '排队等待后台更新…');

  if (!a.ok) {
    return `<div class="card dead">${actions(a)}
      <div class="card-head">
        <div class="name-line"><span class="label">${esc(a.label)}</span></div>
        <div class="identity-meta">
          <span class="department-mark">${esc(departmentName(a.department))}</span>
          <span class="email" title="${esc(a.email)}">${esc(a.email)}</span>
        </div>
      </div>
      <div class="err">${a.expired ? '会话已失效，点右上角钥匙图标重新粘贴 cookie' : esc(a.error)}</div>
      ${a.ok_at ? `<div class="meta"><div><span>最后统计</span>
        <b>${esc(statTime(a.ok_at))}</b></div></div>` : ''}
    </div>`;
  }

  const d = a.data, q = d.quota, c = d.cycle, p = d.plan, s = d.spend_usd, od = d.on_demand;
  const grok = d.grok_weekly;
  const exhausted = quotaExhausted(q);
  const cycleRemaining = remainingUntil(c.reset_at);
  return `<div class="card${exhausted ? ' exhausted' : ''}">
    ${exhausted ? '<span class="burnout-watermark" aria-hidden="true"><span>燃</span><span>尽</span><span>了</span></span>' : ''}
    ${ribbon(quotaTier(q))}
    ${cycleRing(c)}
    ${actions(a)}
    <div class="card-head">
      <div class="name-line">
        <span class="label">${esc(a.label)}</span>
        <span class="plan">${esc(p.name || p.membership_type || '未知套餐')}</span>
      </div>
      <div class="identity-meta">
        <span class="department-mark">${esc(departmentName(a.department))}</span>
        <span class="email" title="${esc(d.email)}">${esc(d.email)}</span>
      </div>
    </div>
    <div class="quota">
      ${bar('Cursor Models', q.cursor_models, a.id, 'cursor_models')}
      ${bar('Other Models', q.other_models, a.id, 'other_models')}
      ${bar('综合', q.overall, a.id, 'overall')}
    </div>
    <div class="meta">
      <div><span>最后统计</span><b>${esc(statTime(a.ok_at))}</b></div>
      <div><span>额度刷新</span><b>${localDateTime(c.reset_at)}${cycleRemaining ? ` · ${cycleRemaining}` : ''}</b></div>
      <div><span class="tip left" data-tip="${esc(spendTip(q.overall, p, s))}">本周期消费</span>
        <b>${spendValue(q.overall, s)}</b></div>
      <div><span>按量付费</span><b>${od.enabled ? '开启 · 已用 ' + money(od.used_usd) : '关闭'}</b></div>
      ${grok ? `<div>
        <span class="tip left" data-tip="${esc(GROK_TIP)}">Grok Bot 周额度</span>
        <b style="color:${color(grok.remaining_pct)}">剩 ${grok.remaining_pct.toFixed(1)}%<span style="color:var(--dimmer);font-weight:400"> · ${localDate(grok.reset_at)} 重置</span></b>
      </div>` : ''}
    </div>
    ${a.stale ? `<div class="stale">⚠ ${esc(staleText(a))}</div>` : ''}
  </div>`;
}

const departmentName = (department) => department || '未分组';

function departmentStats() {
  return departmentSummary.map((item) => [item.department || '', item.count])
    .sort(([a], [b]) => {
      if (!a) return 1;
      if (!b) return -1;
      return a.localeCompare(b, 'zh-CN');
    });
}

function renderDepartmentTabs() {
  const stats = departmentStats();
  const tabs = [[ALL_DEPARTMENTS, '全部', totalAccountCount],
    ...stats.map(([department, count]) => [department, departmentName(department), count])];
  $('#department-tabs').innerHTML = tabs.map(([department, name, count]) => `
    <button class="department-tab" type="button" role="tab"
      data-department-filter="${esc(department)}"
      aria-selected="${department === selectedDepartment}">
      ${esc(name)}<span class="department-count">${count}</span>
    </button>`).join('');
}

function populateDepartmentSelect(select, newInput, current = '') {
  const departments = departmentStats()
    .map(([department]) => department)
    .filter(Boolean);
  if (current && !departments.includes(current)) departments.push(current);
  departments.sort((a, b) => a.localeCompare(b, 'zh-CN'));
  select.innerHTML = [
    '<option value="">不选择（未分组）</option>',
    ...departments.map((department) =>
      `<option value="${esc(department)}">${esc(department)}</option>`),
    `<option value="${NEW_DEPARTMENT}">＋ 新建部门…</option>`
  ].join('');
  select.value = current || '';
  newInput.value = '';
  newInput.hidden = true;
}

function toggleNewDepartment(select, newInput) {
  newInput.hidden = select.value !== NEW_DEPARTMENT;
  if (!newInput.hidden) newInput.focus();
}

function readDepartment(select, newInput) {
  return select.value === NEW_DEPARTMENT ? newInput.value.trim() : select.value;
}

const accountOrder = (account) => Number.isFinite(account._order)
  ? account._order : Number.MAX_SAFE_INTEGER;

function overallRemaining(account) {
  if (account._loading || account.pending || !account.ok) return null;
  const remaining = account.data?.quota?.overall?.remaining_pct;
  return typeof remaining === 'number' && Number.isFinite(remaining) ? remaining : null;
}

function sortedAccounts() {
  return [...accounts].sort((a, b) => {
    if (sortMode === SORT_ADDED) return accountOrder(a) - accountOrder(b);
    const aRemaining = overallRemaining(a);
    const bRemaining = overallRemaining(b);
    if (aRemaining === null && bRemaining === null) {
      const pendingOrder = Number(Boolean(a._loading || a.pending))
        - Number(Boolean(b._loading || b.pending));
      return pendingOrder || accountOrder(a) - accountOrder(b);
    }
    if (aRemaining === null) return 1;
    if (bRemaining === null) return -1;
    const delta = sortMode === SORT_REMAINING_ASC
      ? aRemaining - bRemaining : bRemaining - aRemaining;
    return delta || accountOrder(a) - accountOrder(b);
  });
}

function render() {
  renderDepartmentTabs();
  if (!accounts.length) {
    const message = totalAccountCount
      ? `${departmentName(selectedDepartment)}暂无账号。`
      : '还没有账号。';
    view.innerHTML = `<div class="empty"><p>${esc(message)}</p>
      <button class="primary" onclick="document.getElementById('add').click()">+ 添加账号</button></div>`;
    return;
  }
  view.innerHTML = `<div class="grid">${sortedAccounts().map(card).join('')}</div>`;
}

function showSkeletons(n) {
  view.innerHTML = `<div class="grid">${Array.from(
    { length: Math.max(1, n) }, () => skeleton()
  ).join('')}</div>`;
}

function stamp() {
  const parts = [];
  if (autoRefreshCycle > 0) {
    parts.push(`后台每 ${Math.max(1, Math.round(autoRefreshCycle / 60))} 分钟轮一遍`);
  }
  const ages = accounts.map((a) => a.age).filter((v) => typeof v === 'number');
  if (ages.length) {
    parts.push(`最近更新 ${relative(Date.now() - Math.min(...ages) * 1000)}`);
  }
  $('#stamp').textContent = parts.join(' · ');
}

// ---------- 拉数据 ----------
// 页面只读服务端快照，永远不触发对 cursor.com 的回源——回源是后台调度器的事。
// 所以这里一个请求就能把整组卡片拿回来，不再需要多个 worker 逐卡请求。
async function load({ silent = false } = {}) {
  if (silent && inFlight) return;
  const generation = ++loadGeneration;
  if (loadController) loadController.abort();
  loadController = new AbortController();
  const { signal } = loadController;
  inFlight = true;
  const lastCountKey = `lastCount:${selectedDepartment}`;
  if (!silent) {
    $('#stamp').textContent = '';
    showSkeletons(accounts.length || Number(localStorage.getItem(lastCountKey) || 1));
  }
  try {
    let payload = null;
    for (let attempt = 0; attempt < 2; attempt += 1) {
      const params = new URLSearchParams();
      if (selectedDepartment !== ALL_DEPARTMENTS) {
        params.set('department', selectedDepartment);
      }
      const suffix = params.size ? '?' + params.toString() : '';
      const r = await fetch('/api/accounts' + suffix, { headers: headers(), signal });
      if (r.status === 401) {
        if (!$('#auth').open) openModal($('#auth'));
        view.innerHTML = '';
        return;
      }
      const data = await r.json();
      if (!r.ok) throw new Error(data.detail || '读取账号失败');
      departmentSummary = data.departments || [];
      totalAccountCount = data.total || 0;
      // 选中的部门可能已经被删空了，退回"全部"再拉一次
      const available = new Set(departmentSummary.map((item) => item.department || ''));
      if (selectedDepartment !== ALL_DEPARTMENTS && !available.has(selectedDepartment)) {
        selectedDepartment = ALL_DEPARTMENTS;
        localStorage.setItem('selectedDepartment', selectedDepartment);
        continue;
      }
      payload = data;
      break;
    }
    if (!payload || generation !== loadGeneration) return;

    accounts = payload.accounts.map((account, order) => ({ ...account, _order: order }));
    localStorage.setItem(lastCountKey, accounts.length);
    render();
    stamp();
  } catch (e) {
    if (e.name === 'AbortError') return;
    if (silent) return;                    // 轮询失败就等下一轮，别把页面清空
    view.innerHTML = `<div class="empty">读取失败：${esc(e.message)}</div>`;
  } finally {
    if (generation === loadGeneration) inFlight = false;
  }
}

// 后台在错开刷新，页面开着就定期把快照捞回来，不用人去点
setInterval(() => {
  if (!document.hidden && accounts.length) load({ silent: true });
}, POLL_INTERVAL);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && accounts.length) load({ silent: true });
});

async function refreshOne(id) {
  const i = accounts.findIndex(a => a.id === id);
  if (i < 0) return;
  const order = accounts[i]._order;
  accounts[i] = { ...accounts[i], _loading: true };
  render();
  try {
    const r = await fetch(`/api/accounts/${encodeURIComponent(id)}/refresh`,
                          { method: 'POST', headers: headers() });
    if (r.status === 401) { openModal($('#auth')); return; }
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '刷新失败');
    accounts[i] = { ...d.account, _order: order };
    if (d.notice) toast(d.notice);
  } catch (e) {
    accounts[i] = {
      ...accounts[i], _loading: false, ok: false, expired: false,
      pending: false, error: e.message
    };
  }
  render();
  stamp();
}

// ---------- 模型明细 ----------
// 点额度行才会向 cursor.com 要一次明细。**别做成打开页面就批量拉**：42 个账号
// 一起拉就是又一次请求洪峰，而这正是本项目最大的风险（按 IP 限流）的来源。
const detailDlg = $('#detail-dlg');
let detailRequest = 0;

// 模型名长短不一，骨架也跟着长短不一，比一排等宽方块更像正在填的表
const SKEL_WIDTHS = ['64%', '52%', '71%', '45%', '58%', '49%'];

function detailSkeletonGroup(rows) {
  return `<div class="detail-group">
    <div class="detail-skel-head">
      <span class="skel" style="width:104px;height:13px"></span>
      <span class="skel" style="width:180px"></span>
    </div>
    <div class="detail-skel-row head">
      <span class="skel" style="width:28px"></span>
      <span class="skel"></span><span class="skel"></span><span class="skel"></span>
      <span class="skel"></span><span class="skel"></span>
    </div>
    ${SKEL_WIDTHS.slice(0, rows).map((w) => `<div class="detail-skel-row">
      <span class="skel" style="width:${w}"></span>
      <span class="skel"></span><span class="skel"></span><span class="skel"></span>
      <span class="skel"></span><span class="skel"></span>
    </div>`).join('')}
  </div>`;
}

// 综合视图等下会出两组表，骨架就先占两组的位置，填上数据时不会整块跳一下
const detailSkeleton = (group) => group === 'overall'
  ? detailSkeletonGroup(5) + detailSkeletonGroup(3)
  : detailSkeletonGroup(5);

function detailRows(models) {
  if (!models.length) return '<div class="detail-empty">本周期还没有这类模型的用量。</div>';
  return `<div class="detail-scroll"><table class="detail">
    <thead><tr><th>模型</th><th>输入</th><th>输出</th>
      <th title="写入缓存的 token，按各家自己的缓存写单价计费">缓存写</th>
      <th title="命中缓存读回的 token，单价通常只有输入的 1/10，但量大，往往是花费大头">缓存读</th>
      <th>花费</th></tr></thead>
    <tbody>${models.map((m) => `<tr>
        <td class="model">${esc(m.model)}</td>
        <td title="${esc(exactTokens(m.input_tokens))}">${shortTokens(m.input_tokens)}</td>
        <td title="${esc(exactTokens(m.output_tokens))}">${shortTokens(m.output_tokens)}</td>
        <td title="${esc(exactTokens(m.cache_write_tokens))}">${shortTokens(m.cache_write_tokens)}</td>
        <td title="${esc(exactTokens(m.cache_read_tokens))}">${shortTokens(m.cache_read_tokens)}</td>
        <td class="cost${m.spend_usd ? '' : ' zero'}">${money(m.spend_usd)}</td>
      </tr>`).join('')}</tbody>
  </table></div>`;
}

function detailGroup(group, quota) {
  const limit = quota && quota.limit_usd != null
    ? ` / 上限 ${esc(shortMoney(quota.limit_usd))}` : '';
  return `<div class="detail-group">
    <div class="detail-group-head">
      <span class="detail-group-name">${esc(group.name)}</span>
      <span class="detail-group-sum">已用 ${money(group.spend_usd)}${limit}
        · ${shortTokens(group.total_tokens)} tokens</span>
    </div>
    ${detailRows(group.models)}
  </div>`;
}

function renderDetail(d, group) {
  const groups = group === 'overall' ? d.groups : d.groups.filter((g) => g.key === group);
  const parts = [`统计窗口 ${localDateTime(d.cycle_start)} 起`];
  if (d.fetched_at) parts.push(`取数于 ${statTime(d.fetched_at)}`);
  $('#detail-note').textContent = parts.join(' · ');
  const totals = group === 'overall' && d.totals.model_count
    ? `<div class="detail-total">
        <span>本周期合计 ${d.totals.model_count} 个模型 ·
          ${shortTokens(d.totals.total_tokens)} tokens</span>
        <span>${money(d.totals.spend_usd)}</span>
      </div>` : '';
  $('#detail-body').innerHTML = groups.map((g) => detailGroup(g, (d.quota || {})[g.key])).join('') + totals;
}

async function openDetail(id, group) {
  const account = accounts.find((a) => a.id === id);
  const generation = ++detailRequest;
  // 分类名由组头负责显示，标题只认账号，免得单组视图里同一个词写两遍
  $('#detail-title').textContent = `${account ? account.label : id} · 本周期模型明细`;
  $('#detail-note').textContent = '正在从 Cursor 取本周期明细…';
  $('#detail-body').innerHTML = detailSkeleton(group);
  openModal(detailDlg);
  try {
    const r = await fetch(`/api/accounts/${encodeURIComponent(id)}/usage-detail`,
                          { headers: headers() });
    if (r.status === 401) { detailDlg.close(); openModal($('#auth')); return; }
    const d = await r.json();
    if (generation !== detailRequest) return;   // 关掉又点了别的，别让旧响应覆盖
    if (!r.ok) throw new Error(d.detail || '读取明细失败');
    renderDetail(d, group);
  } catch (e) {
    if (generation !== detailRequest) return;
    $('#detail-note').textContent = '';
    $('#detail-body').innerHTML = `<div class="detail-empty">${esc(e.message)}</div>`;
  }
}

// 背景锁滚动：showModal() 不会阻止 body 跟着滚，滚轮落在遮罩上照样能拖动底下的页面
function openModal(dlg) {
  const barWidth = window.innerWidth - document.documentElement.clientWidth;
  if (barWidth > 0) document.body.style.paddingRight = barWidth + 'px';
  document.body.classList.add('modal-open');
  if (!dlg.open) dlg.showModal();
}

// 盯 open 属性而不是监听 close 事件：关闭路径有四条（× 按钮、取消按钮、Esc、
// 提交后自动关），close 事件在实测的 Chrome 里并不总会派发，属性变化则一定有
const modalLock = new MutationObserver(() => {
  if (document.querySelector('dialog[open]')) return;     // 还有别的弹窗开着
  document.body.classList.remove('modal-open');
  document.body.style.paddingRight = '';
});
document.querySelectorAll('dialog').forEach((dlg) => {
  modalLock.observe(dlg, { attributes: true, attributeFilter: ['open'] });
});

let toastTimer = null;
function toast(text) {
  const el = $('#stamp');
  clearTimeout(toastTimer);
  el.textContent = text;
  toastTimer = setTimeout(stamp, 4000);
}

view.addEventListener('click', async (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const { del, one, edit, deptId, detail, group, label, department } = btn.dataset;
  if (btn.dataset.showAll !== undefined) {
    selectDepartment(ALL_DEPARTMENTS);
    return;
  }
  if (del !== undefined) {
    if (!confirm(`删除账号 ${del}？只从服务端账号库移除，不影响 Cursor 账号本身。`)) return;
    const r = await fetch('/api/accounts/' + encodeURIComponent(del), {
      method: 'DELETE', headers: headers()
    });
    if (r.ok) load();
  } else if (one !== undefined) {
    refreshOne(one);
  } else if (detail !== undefined) {
    openDetail(detail, group);
  } else if (deptId !== undefined) {
    openDepartmentDialog(deptId, label, department);
  } else if (edit !== undefined) {
    openDialog(label, department, true);
  }
});

function selectDepartment(department) {
  if (department === selectedDepartment) return;
  selectedDepartment = department;
  localStorage.setItem('selectedDepartment', department);
  load();
}

$('#department-tabs').addEventListener('click', (e) => {
  const tab = e.target.closest('[data-department-filter]');
  if (tab) selectDepartment(tab.dataset.departmentFilter);
});

$('#sort-order').value = sortMode;
$('#sort-order').addEventListener('change', (e) => {
  sortMode = SORT_MODES.has(e.target.value) ? e.target.value : SORT_ADDED;
  localStorage.setItem('accountSort', sortMode);
  render();
});

// ---------- 添加 / 重新授权 ----------
const dlg = $('#dlg'), dstat = $('#d-status');
const say = (text, cls = '') => { dstat.className = 'status ' + cls; dstat.textContent = text; };

function openDialog(label = '', department = '', isEdit = false) {
  $('#d-title').textContent = isEdit ? '重新授权' : '添加账号';
  $('#d-label').value = label || '';
  populateDepartmentSelect($('#d-department'), $('#d-department-new'), department);
  $('#d-cookie').value = '';
  $('#d-save').disabled = false;
  say('');
  openModal(dlg);
  (isEdit ? $('#d-cookie') : $('#d-label')).focus();
}

$('#d-save').onclick = async () => {
  const cookie = $('#d-cookie').value.trim();
  const department = readDepartment($('#d-department'), $('#d-department-new'));
  if (!cookie) return say('cookie 不能为空', 'bad');
  if ($('#d-department').value === NEW_DEPARTMENT && !department) {
    return say('请输入新部门名称，或选择未分组', 'bad');
  }
  $('#d-save').disabled = true;
  say('校验中…', 'busy');
  try {
    const r = await fetch('/api/accounts', {
      method: 'POST', headers: jsonHeaders(),
      body: JSON.stringify({
        cookie,
        label: $('#d-label').value.trim() || null,
        department
      })
    });
    const d = await r.json();
    if (r.ok) {
      selectedDepartment = d.department || '';
      localStorage.setItem('selectedDepartment', selectedDepartment);
      say('已保存 ' + (d.email || d.label), 'good');
      setTimeout(() => { dlg.close(); load(); }, 700);
    } else {
      say(d.detail || '保存失败', 'bad');
      $('#d-save').disabled = false;
    }
  } catch (e) {
    say('请求失败：' + e.message, 'bad');
    $('#d-save').disabled = false;
  }
};

$('#add').onclick = () => openDialog(
  '', selectedDepartment === ALL_DEPARTMENTS ? '' : selectedDepartment
);
$('#d-cancel').onclick = () => dlg.close();
$('#d-department').onchange = () =>
  toggleNewDepartment($('#d-department'), $('#d-department-new'));

// ---------- 调整分组 ----------
const departmentDlg = $('#department-dlg');
let departmentAccountId = '';

function openDepartmentDialog(id, label, department) {
  departmentAccountId = id;
  $('#department-account').textContent = label;
  populateDepartmentSelect($('#department-input'), $('#department-new'), department);
  $('#department-status').textContent = '';
  $('#department-status').className = 'status';
  $('#department-save').disabled = false;
  openModal(departmentDlg);
  $('#department-input').focus();
}

$('#department-save').onclick = async () => {
  const department = readDepartment($('#department-input'), $('#department-new'));
  const status = $('#department-status');
  if ($('#department-input').value === NEW_DEPARTMENT && !department) {
    status.className = 'status bad';
    status.textContent = '请输入新部门名称，或选择未分组';
    return;
  }
  $('#department-save').disabled = true;
  status.className = 'status busy';
  status.textContent = '保存中…';
  try {
    const r = await fetch(`/api/accounts/${encodeURIComponent(departmentAccountId)}/department`, {
      method: 'PATCH', headers: jsonHeaders(), body: JSON.stringify({ department })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.detail || '保存失败');
    const account = accounts.find((item) => item.id === departmentAccountId);
    if (account) account.department = d.department || '';
    selectedDepartment = d.department || '';
    localStorage.setItem('selectedDepartment', selectedDepartment);
    departmentDlg.close();
    load();
  } catch (e) {
    status.className = 'status bad';
    status.textContent = e.message;
    $('#department-save').disabled = false;
  }
};

$('#department-cancel').onclick = () => departmentDlg.close();
$('#department-input').onchange = () =>
  toggleNewDepartment($('#department-input'), $('#department-new'));

document.querySelectorAll('[data-close-dialog]').forEach((button) => {
  button.onclick = () => document.getElementById(button.dataset.closeDialog).close();
});

// ---------- 口令 ----------
$('#a-ok').onclick = async () => {
  token = $('#a-token').value.trim();
  const r = await fetch('/api/account-index', { headers: headers() });
  if (r.status === 401) {
    $('#a-status').className = 'status bad';
    $('#a-status').textContent = '口令不对';
    return;
  }
  localStorage.setItem('panelToken', token);
  $('#auth').close();
  load();
};

fetch('/api/config').then(r => r.json()).then(c => {
  autoRefreshCycle = c.auto_refresh ? (c.cycle_seconds || 0) : 0;
  if (c.needs_token && !token) openModal($('#auth')); else load();
}).catch(() => load());
</script>
